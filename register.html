<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🩸 Blood Donor Management System</h1>
    <p>Donor Registration</p>
</header>

<div class="container">

    <button onclick="window.location.href='dashboard.html'">
        📋 Dashboard
    </button>

    <br><br>

    <h2 id="formTitle">Register New Donor</h2>

    <form id="donorForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <input
            type="number"
            id="age"
            placeholder="Age"
            required
        >

        <select id="bloodGroup" required>

            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>

        </select>

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <input
            type="text"
            id="district"
            placeholder="District"
            required
        >

        <textarea
            id="address"
            placeholder="Address"
            required
        ></textarea>

        <button type="submit" id="submitBtn">
            Register Donor
        </button>

    </form>

</div>

<script src="register.js"></script>

</body>
</html>
